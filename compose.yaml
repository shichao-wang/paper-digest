services:
  paper-digest:
    build: .
    restart: unless-stopped
    init: true
    volumes:
      - digest-data:/data
      - ./config/config.json:/app/config/config.json:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/paper-digest", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # 无公网端口；未来若加 cloudflared，须单独配置 Access。
volumes:
  digest-data:
